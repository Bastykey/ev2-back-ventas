services:
  mysql-ventas:
    image: mysql:8.0
    container_name: mysql-ventas
    environment:
      MYSQL_DATABASE: ventas_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - ventas_data:/var/lib/mysql
    networks:
      - ventas-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-ventas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: back-ventas
    depends_on:
      mysql-ventas:
        condition: service_healthy
    environment:
      DB_ENDPOINT: mysql-ventas
      DB_PORT: 3306
      DB_NAME: ventas_db
      DB_USERNAME: user
      DB_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ventas:3306/ventas_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8082:8080"
    networks:
      - ventas-net
    restart: unless-stopped

volumes:
  ventas_data:

networks:
  ventas-net:
    driver: bridge